name: Bootstrap proxy data

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bootstrap-proxy-data.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Proxcy
        uses: actions/checkout@v4

      - name: Copy latest published proxy results
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/data
          base="https://raw.githubusercontent.com/Riyoway/Proxies/master"
          for file in data.json history.json http.txt socks4.txt socks5.txt all.txt; do
            curl --fail --location --retry 3 --retry-delay 2 \
              "$base/$file" \
              --output "public/data/$file"
          done

      - name: Commit initial data snapshot
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/data && [ -z "$(git ls-files --others --exclude-standard public/data)" ]; then
            echo "Proxy data is already up to date."
            exit 0
          fi

          git config user.name "proxcy-data[bot]"
          git config user.email "proxcy-data[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "chore: bootstrap proxy data"
          git push
